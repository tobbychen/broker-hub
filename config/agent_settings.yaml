agents:
  monitor:
    price_change_threshold: 0.03
    volume_spike_multiplier: 2.0
    check_interval_seconds: 60
    arbitrage_threshold: 0.005
    card_price_threshold: 0.05

  merchandise:
    check_interval_seconds: 300  # 5 minutes - less frequent than crypto/stocks
    price_drop_threshold: 0.10   # Alert if price drops 10% from purchase
    arbitrage_threshold: 0.10     # Alert if same item 10% cheaper elsewhere

  research:
    timeout_seconds: 120
    max_sources: 5
    confidence_threshold: 0.6

  risk:
    max_position_pct: 0.20
    max_sector_pct: 0.40
    max_correlation: 0.80

  autonomy:
    enabled: false  # Phase 1: disabled, all trades need human approval
    auto_approve:
      max_position_value: 10000  # ¥10K max for auto-approve
      min_confidence: 0.85       # 85% confidence minimum
      max_risk: low              # Only low risk trades auto-approve
      allowed_asset_class:
        - crypto
        - stock
      allowed_exchanges:
        - Binance
        - OKX
        - SSE/SZSE

  decision:
    timeout_minutes: 30
    escalation_threshold: 0.9

  daily_report:
    send_time: "08:00"
    timezone: "Asia/Shanghai"
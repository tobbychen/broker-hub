llm:
  primary:
    provider: minimax
    api_key: ${MINIMAX_API_KEY}
    model: ${MINIMAX_MODEL:-auto}
    base_url: ${MINIMAX_BASE_URL:-https://api.minimax.chat/v1}

  fallback:
    - provider: glm
      api_key: ${GLM_API_KEY}
      model: ${GLM_MODEL:-glm-4}
      base_url: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
    - provider: kimi
      api_key: ${KIMI_API_KEY}
      model: ${KIMI_MODEL:-moonshot-v1-128k}
      base_url: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}

market_data:
  akshare:
    enabled: true
  binance:
    enabled: true
    api_key: ${BINANCE_API_KEY}
    secret: ${BINANCE_SECRET}
  yfinance:
    enabled: true
  ebay:
    enabled: true
    api_key: ${EBAY_API_KEY}
    # Watched cards — add your cards here
    watched_cards:
      - id: pika_001
        name: Charizard
        set_name: Base Set
        year: 1999
        category: pokemon
        min_grade: "PSA 10"
        last_price: 5000
      - id: nba_001
        name: Michael Jordan
        set_name: 1986 Fleer
        category: basketball
        min_grade: "PSA 10"
        last_price: 150000

discord:
  enabled: true
  bot_token: ${DISCORD_BOT_TOKEN}
  channel_id: ${DISCORD_CHANNEL_ID}
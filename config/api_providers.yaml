llm:
  primary:
    provider: minimax
    api_key: ${MINIMAX_API_KEY}
    model: ${MINIMAX_MODEL:-auto}
    base_url: ${MINIMAX_BASE_URL:-https://api.minimax.chat/v1}

  fallback:
    - provider: glm
      api_key: ${GLM_API_KEY}
      model: ${GLM_MODEL:-glm-4}
      base_url: ${GLM_BASE_URL:-https://open.bigmodel.cn/api/paas/v4}
    - provider: kimi
      api_key: ${KIMI_API_KEY}
      model: ${KIMI_MODEL:-moonshot-v1-128k}
      base_url: ${KIMI_BASE_URL:-https://api.moonshot.cn/v1}

market_data:
  akshare:
    enabled: true
  okx:
    enabled: true
  binance:
    enabled: true
    api_key: ${BINANCE_API_KEY}
    secret: ${BINANCE_SECRET}
  yfinance:
    enabled: true
  ebay:
    enabled: true
    client_id: ${EBAY_CLIENT_ID}
    client_secret: ${EBAY_CLIENT_SECRET}

notification:
  enabled: true
  # Telegram — get token from @BotFather, chat_id from @userinfobot
  bot_token: ${TELEGRAM_BOT_TOKEN}
  channel_id: ${TELEGRAM_CHAT_ID}  # Your Telegram chat ID or group ID